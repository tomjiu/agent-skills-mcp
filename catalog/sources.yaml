# Local AI source catalog (URLs first, names second)
# Strategy for agents:
#   1) official  2) registry/marketplace  3) awesome lists  4) domain tools  5) skills hubs
# Load this file via skill: source-index (on-demand). Do not dump all URLs into every turn.

version: 1
updated: 2026-07-18
policy:
  prefer_official_over_forks: true
  prefer_canonical_org_repos: true
  search_order:
    - official
    - search
    - registry
    - awesome
    - vendor_mcp
    - reverse_engineering
    - security
    - firmware
    - android
    - dfir
    - skills
    - agent_ecosystem
    - community
  notes:
    - "Skills can be many; only fixed-start skills load every session."
    - "Use source-index skill to pick the right URL before cloning/installing."
    - "Expand this file over time; keep dead links pruned."

